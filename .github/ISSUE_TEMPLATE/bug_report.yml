name: Bug report
description: Report a reproducible problem in AXtory
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please do not include prompts, responses, tokens, repository names, or other sensitive local evidence.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include sanitized commands and the collector or source involved.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AXtory version or commit
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
  - type: input
    id: source
    attributes:
      label: Source / connector
      placeholder: claude, codex, gemini, opencode, git, github, jira, ...
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Remove raw conversation content, identifiers, paths, tokens, and repository names.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
