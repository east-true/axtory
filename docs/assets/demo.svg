<svg xmlns="http://www.w3.org/2000/svg" width="880" height="536" viewBox="0 0 880 536" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">
  <style>
    .bg { fill: #14161a; }
    .bar { fill: #1d2026; }
    .prompt { fill: #6ee7a8; }
    .cmd { fill: #e8eaed; }
    .title { fill: #e8eaed; font-weight: 600; }
    .key { fill: #9aa4b2; }
    .val { fill: #e8eaed; }
    .ok { fill: #6ee7a8; }
    .tag { fill: #7cb7ff; }
    .warn { fill: #f0c674; }
    .miss { fill: #f0c674; }
    .dim { fill: #6b7280; }
    .note { fill: #8b93a1; font-style: italic; }
    .str { fill: #a5d6a7; }
  </style>

  <rect class="bg" x="0" y="0" width="880" height="536" rx="10"/>
  <rect class="bar" x="0" y="0" width="880" height="34" rx="10"/>
  <rect class="bar" x="0" y="24" width="880" height="10"/>
  <circle cx="20" cy="17" r="5" fill="#ff5f57"/>
  <circle cx="38" cy="17" r="5" fill="#febc2e"/>
  <circle cx="56" cy="17" r="5" fill="#28c840"/>
  <text x="440" y="21" text-anchor="middle" class="dim" font-size="11">axtory</text>

  <text xml:space="preserve" x="24" y="68"><tspan class="prompt">$ </tspan><tspan class="cmd">npm run skeleton</tspan></text>

  <text xml:space="preserve" x="24" y="108" class="title">AXtory fixture analysis</text>
  <text xml:space="preserve" x="24" y="128"><tspan class="key">Coverage: </tspan><tspan class="ok">COMPLETE_FOR_RETURNED_VIEW</tspan></text>
  <text xml:space="preserve" x="24" y="148"><tspan class="key">session.count: </tspan><tspan class="val">1 count </tspan><tspan class="tag">[CALCULATED]</tspan></text>
  <text xml:space="preserve" x="24" y="168"><tspan class="key">message.count: </tspan><tspan class="val">3 count </tspan><tspan class="tag">[CALCULATED]</tspan></text>
  <text xml:space="preserve" x="24" y="188"><tspan class="key">tool.invocation.count: </tspan><tspan class="val">3 count </tspan><tspan class="tag">[CALCULATED]</tspan></text>
  <text xml:space="preserve" x="24" y="208"><tspan class="key">agent.assertion.count: </tspan><tspan class="miss">unavailable </tspan><tspan class="warn">[NOT_SUPPORTED]</tspan></text>
  <text xml:space="preserve" x="24" y="228" class="dim">  Reason: The rule-based fact analyzer does not classify free-form</text>
  <text xml:space="preserve" x="24" y="248" class="dim">  assistant content as assertions.</text>
  <text xml:space="preserve" x="24" y="268"><tspan class="key">usage.input.tokens: </tspan><tspan class="miss">unavailable </tspan><tspan class="warn">[NOT_COLLECTED]</tspan></text>
  <text xml:space="preserve" x="24" y="288" class="dim">  Reason: Session history views are not used as authoritative token</text>
  <text xml:space="preserve" x="24" y="308" class="dim">  telemetry.</text>

  <text xml:space="preserve" x="24" y="348"><tspan class="prompt">$ </tspan><tspan class="cmd">npm run skeleton</tspan><tspan class="note">          # same fixture, run again</tspan></text>
  <text xml:space="preserve" x="24" y="368"><tspan class="prompt">$ </tspan><tspan class="cmd">node dist/src/cli.js list --data-dir .local/axtory</tspan></text>

  <text xml:space="preserve" x="24" y="408" class="key">  "revisions": [</text>
  <text xml:space="preserve" x="24" y="428"><tspan class="key">    { "revisionId": </tspan><tspan class="str">"revision_72779eed…"</tspan><tspan class="key">, "rawRetained": </tspan><tspan class="ok">true</tspan><tspan class="key"> }</tspan></text>
  <text xml:space="preserve" x="24" y="448" class="key">  ]</text>

  <text xml:space="preserve" x="24" y="492" class="note"># one revision, not two — the raw view's content hash did not change</text>
</svg>
